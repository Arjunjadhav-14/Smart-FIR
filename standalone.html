    body {

    /* Custom official seal background dot grid */
    .gov-seal-bg {
      background-image: radial-gradient(rgba(26, 58, 107, 0.02) 1px, transparent 1px);

    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #F3F4F6;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    @keyframes pulse-red {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4);
      }

      50% {
        transform: scale(1.02);
        box-shadow: 0 0 0 10px rgba(220, 38, 38, 0);
      }
    }

    .animate-pulse-red {
      animation: pulse-red 2s infinite;
    }

    @keyframes siren {

      0%,
      100% {
        background-color: #FEE2E2;
      }

      50% {
        background-color: #FCA5A5;
      }
    }

    .animate-siren {

          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return (R * c).toFixed(1);

          }

          let category = "Other";
          if (userText.toLowerCase().includes("stolen") || userText.toLowerCase().includes("theft") || userText.toLowerCase().includes("robbed") || userText.toLowerCase().includes("chori") || userText.toLowerCase().includes("wallet")) {
            category = "Theft / Robbery";

            category = "Cybercrime / Fraud";

            category = "Assault / Violence";
          } else if (userText.toLowerCase().includes("harass") || userText.toLowerCase().includes("stalk") || userText.toLowerCase().includes("eve") || userText.toLowerCase().includes("followed")) {
            category = "Harassment / Stalking";

          setSeverity(legalDetails.severity);
          setAnswers(prev => ({ ...prev, incidentDesc: (prev.incidentDesc + " " + userText).trim() }));

          setChatHistory(prev => [
            ...prev,
            { role: "assistant", text: fallbackReply }
          ]);
        }

                    )}
                  </div>
                )}
                
                {trackingError && (
                  <div className="bg-red-50 border border-red-200 text-red-700 text-xs font-bold p-3 rounded-2xl mb-6 flex items-center gap-2">
                    <Icon name="alertTriangle" className="w-4 h-4" /> {trackingError}
                  </div>
                )}

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <div className="col-span-12 lg:col-span-7 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm relative min-h-[350px]">
                    <div
                      ref={mapContainerRef}
                      style={{ height: '300px', width: '100%', borderRadius: '16px' }}
                      className="w-full h-full bg-slate-100 flex items-center justify-center overflow-hidden border border-slate-200 animate-pulse"
                    >
                      <p className="text-xs text-slate-500 font-bold">Loading Google Maps API...</p>
                    </div>
                  </div>

                  <div className="col-span-12 lg:col-span-5 flex flex-col gap-3">
                    <h3 className="text-xs font-black text-slate-800 uppercase tracking-wider mb-2 border-b border-slate-100 pb-2">
                      Precinct Jurisdictions Listing
                    </h3>

                    <div className="flex flex-col gap-3 max-h-[350px] overflow-y-auto custom-scrollbar">
                      {isSearchingPlaces && (
                        <div className="p-4 text-center text-xs text-slate-500 font-bold bg-slate-50 rounded-xl animate-pulse">
                          Scanning area for active police stations...
                        </div>
                      )}
                      {!isSearchingPlaces && sortedStations.map((ps) => (
                        <div 
                          key={ps.id} 
                          className={`p-4 rounded-2xl bg-white border border-slate-200 text-xs flex items-center justify-between gap-4 transition-all hover:border-[#1A3A6B]/30`}
                        >
                          <div className="min-w-0">
                            <div className="flex items-center gap-1.5 flex-wrap">
                              <h4 className="font-bold text-slate-800 leading-tight truncate">{ps.name}</h4>
                              <span className={`px-2 py-0.5 rounded text-[8px] font-mono font-bold uppercase shrink-0 ${
                                ps.type === 'Cyber Cell' ? 'bg-blue-100 text-blue-800' :
                                ps.type === 'Women Station' ? 'bg-rose-100 text-rose-800' :
                                'bg-slate-100 text-slate-600'
                              }`}>
                                {ps.type}
                              </span>
                            </div>
                            <p className="text-[9.5px] text-slate-400 mt-1 leading-normal font-mono">{ps.address}</p>
                            <p className="text-[9px] text-[#1A3A6B] mt-1 font-mono">Distance: {ps.distance || 'GPS Offline'} &bull; Contact: {ps.contact}</p>
                          </div>

                          <div className="flex items-center gap-1.5 shrink-0">
                            <button
                              onClick={() => alert(`Calling Dispatch: ${ps.contact}`)}
                              className="p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-500 hover:text-[#1A3A6B] hover:bg-slate-100 transition-all"
                            >
                              <Icon name="phone" className="w-3.5 h-3.5" />
                            </button>
                            <a 
                              href={liveCoords ? `https://www.google.com/maps/dir/?api=1&origin=${liveCoords.lat},${liveCoords.lng}&destination=${ps.lat},${ps.lng}` : `https://www.google.com/maps/dir/?api=1&destination=${ps.lat},${ps.lng}`}
                              target="_blank" 
                              rel="noopener noreferrer"
                              className="p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-500 hover:text-[#1A3A6B] hover:bg-slate-100 transition-all"
                            >
                              <Icon name="mapPin" className="w-3.5 h-3.5" />
                            </a>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="mt-8 text-center">
                  <button 
                    onClick={() => setCurrentScreen('dashboard')}
                    className="px-6 py-2.5 bg-[#1A3A6B] hover:bg-[#12284C] text-white rounded-xl text-xs font-bold shadow-sm transition-all"
                  >
                    Return to Portal Home
                  </button>
                </div>
              </div>
            )}

            {/* 17. SOS DISPATCH PANEL */}
            {currentScreen === 'sos' && (
              <div className="max-w-3xl mx-auto rounded-3xl p-6 md:p-10 border-4 border-red-600 relative overflow-hidden shadow-2xl bg-white animate-fade-in pb-10">
                <div className="absolute top-4 left-4 right-4 flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-red-600 animate-ping"></span>
                    <span className="text-[9px] text-red-700 font-mono font-black uppercase">LIVE SOS DISPATCH ACTIVE</span>
                  </div>
                  <span className="text-[8px] text-red-600 font-mono">SECURE CHANNEL SEC-SOS-1</span>
                </div>

                <div className="text-center pt-8 pb-4">
                  <div className="w-20 h-20 rounded-full bg-red-50 border-4 border-red-600 flex items-center justify-center mx-auto mb-6 shadow-md animate-pulse">
                    <Icon name="alertTriangle" className="w-10 h-10 text-red-600" />
                  </div>
                  
                  <h2 className="text-2xl font-black text-red-700 mb-1 uppercase tracking-wider">
                    {text.emergencyHeader}
                  </h2>
                  <p className="text-xs text-red-800 font-bold max-w-lg mx-auto leading-relaxed mb-6">
                    {text.emergencySub}
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-12 gap-6 mb-8 relative z-10">
                  <div className="col-span-12 md:col-span-7 bg-white p-5 rounded-2xl border border-red-300 shadow-sm flex flex-col justify-between">
                    <div>
                      <h4 className="text-xs font-black text-red-800 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                        <Icon name="shield" className="w-4.5 h-4.5 text-red-600" />
                        IMMEDIATE SAFETY DIRECTIVES
                      </h4>
                      
                      <ul className="flex flex-col gap-2.5 text-xs text-slate-700 font-bold">
                        <li className="p-2.5 rounded-xl bg-red-50/50 border border-red-100">
                          {text.reachSafety}
                        </li>
                        <li className="p-2.5 rounded-xl bg-red-50/50 border border-red-100">
                          STEP 2: Share Live GPS Coordinates with dispatch numbers.
                        </li>
                        <li className="p-2.5 rounded-xl bg-red-50/50 border border-red-100">
                          STEP 3: Toggle the local alarm sound below to attract help.
                        </li>
                      </ul>
                    </div>

                    <div className="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between gap-3">
                      <span className="text-[9px] text-slate-500 font-bold leading-normal">{text.sirenSimulation}</span>
                      <button 
                        onClick={triggerAudioSiren}
                        className={`px-4 py-2 rounded-xl text-xs font-black uppercase transition-all shadow ${
                          isPlayingSiren 
                            ? 'bg-red-600 text-white animate-pulse' 
                            : 'bg-slate-100 border border-slate-350 text-slate-700 hover:bg-slate-200'
                        }`}
                      >
                        {isPlayingSiren ? text.sirenPlaying : text.sirenToggle}
                      </button>
                    </div>
                  </div>

                  <div className="col-span-12 md:col-span-5 flex flex-col gap-3">
                    <h4 className="text-xs font-black text-slate-800 uppercase tracking-wider mb-1">
                      Emergency Hotlines
                    </h4>
                    
                    <a href="tel:100" className="p-3 bg-red-50 border border-red-200 hover:bg-red-100 text-red-800 rounded-xl flex items-center justify-between transition-all">
                      <div className="flex items-center gap-2">
                        <Icon name="phone" className="w-4 h-4 text-red-600" />
                        <span className="text-xs font-bold">{text.call100}</span>
                      </div>
                      <Icon name="chevronRight" className="w-4 h-4 text-red-600" />
                    </a>
                    
                    <a href="tel:112" className="p-3 bg-red-50 border border-red-200 hover:bg-red-100 text-red-800 rounded-xl flex items-center justify-between transition-all">
                      <div className="flex items-center gap-2">
                        <Icon name="phone" className="w-4 h-4 text-red-600" />
                        <span className="text-xs font-bold">{text.call112}</span>
                      </div>
                      <Icon name="chevronRight" className="w-4 h-4 text-red-600" />
                    </a>
                    
                    <a href="tel:1091" className="p-3 bg-red-50 border border-red-200 hover:bg-red-100 text-red-800 rounded-xl flex items-center justify-between transition-all">
                      <div className="flex items-center gap-2">
                        <Icon name="phone" className="w-4 h-4 text-red-600" />
                        <span className="text-xs font-bold">{text.call1091}</span>
                      </div>
                      <Icon name="chevronRight" className="w-4 h-4 text-red-600" />
                    </a>
                  </div>
                </div>

                <div className="text-center pt-2 border-t border-slate-100">
                  <button 
                    onClick={() => {
                      if (isPlayingSiren) triggerAudioSiren();
                      setCurrentScreen('dashboard');
                    }}
                    className="px-6 py-2.5 border border-slate-350 text-slate-700 hover:bg-slate-50 text-xs font-black rounded-xl uppercase transition-all shadow-sm"
                  >
                    {text.cancelEmergency}
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* ----------------------------------------------------
                OFFICIAL PORTAL FOOTER
                ---------------------------------------------------- */}
          <footer className="mt-20 text-center text-xs text-slate-400 font-mono max-w-xl mx-auto leading-relaxed border-t border-slate-200 pt-6 pb-12">
            <p>&copy; 2026 Smart FIR Portal &bull; Safe Citizen Legal Initiative.</p>
            <p className="mt-1 text-[9px] text-slate-400">All complaint drafts comply strictly with the Bharatiya Nyaya Sanhita (BNS), 2023 & IPC, 1860.</p>
          </footer>

          {/* ----------------------------------------------------
                SLEEK MOBILE BOTTOM NAVIGATION
                ---------------------------------------------------- */}
          {currentUser && (
            <div className="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-slate-200 shadow-[0_-4px_12px_rgba(0,0,0,0.06)] px-2 py-2 flex justify-around items-center md:px-6">
              <button 
                onClick={() => setCurrentScreen('dashboard')} 
                className={`flex flex-col items-center gap-1 py-1.5 px-3.5 rounded-2xl transition-all duration-200 ${currentScreen === 'dashboard' ? 'text-[#1A3A6B] bg-[#E8EEF5] font-black scale-105 shadow-sm' : 'text-slate-400 font-bold hover:text-[#1A3A6B] hover:bg-slate-50'}`}
              >
                <Icon name="home" className="w-5 h-5" />
                <span className="text-[9px] uppercase tracking-wider font-semibold">Home</span>
              </button>
              <button 
                onClick={() => {
                  setWizardCategory(null);
                  setWizardStep(1);
                  setCurrentScreen('stepwizard');
                }} 
                className={`flex flex-col items-center gap-1 py-1.5 px-3.5 rounded-2xl transition-all duration-200 ${currentScreen === 'stepwizard' ? 'text-[#D97706] bg-[#FEF3C7] font-black scale-105 shadow-sm' : 'text-slate-400 font-bold hover:text-[#D97706] hover:bg-slate-50'}`}
              >
                <Icon name="layers" className="w-5 h-5" />
                <span className="text-[9px] uppercase tracking-wider font-semibold">FIR Guide</span>
              </button>
              <button 
                onClick={async () => {
                  if (currentUser) {
                    const data = await dbService.getUserFIRReports(currentUser.uid);
                    setSavedReports(data);
                  }
                  setCurrentScreen('drafts');
                }} 
                className={`flex flex-col items-center gap-1 py-1.5 px-3.5 rounded-2xl transition-all duration-200 ${currentScreen === 'drafts' ? 'text-emerald-700 bg-emerald-50 font-black scale-105 shadow-sm' : 'text-slate-400 font-bold hover:text-emerald-700 hover:bg-slate-50'}`}
              >
                <Icon name="fileText" className="w-5 h-5" />
                <span className="text-[9px] uppercase tracking-wider font-semibold">My Drafts</span>
              </button>
              <button 
                onClick={() => setCurrentScreen('locator')} 
                className={`flex flex-col items-center gap-1 py-1.5 px-3.5 rounded-2xl transition-all duration-200 ${currentScreen === 'locator' ? 'text-[#1A3A6B] bg-[#E8EEF5] font-black scale-105 shadow-sm' : 'text-slate-400 font-bold hover:text-[#1A3A6B] hover:bg-slate-50'}`}
              >
                <Icon name="mapPin" className="w-5 h-5" />
                <span className="text-[9px] uppercase tracking-wider font-semibold">Precinct</span>
              </button>
              <button 
                onClick={() => setCurrentScreen('chat')} 
                className={`flex flex-col items-center gap-1 py-1.5 px-3.5 rounded-2xl transition-all duration-200 ${currentScreen === 'chat' ? 'text-[#1A3A6B] bg-[#E8EEF5] font-black scale-105 shadow-sm' : 'text-slate-400 font-bold hover:text-[#1A3A6B] hover:bg-slate-50'}`}
              >
                <Icon name="messageSquare" className="w-5 h-5" />
                <span className="text-[9px] uppercase tracking-wider font-semibold">AI Help</span>
              </button>
            </div>
          )}

        </div>
      );
    }

    // Render root node
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
