    body {

    /* Custom official seal background dot grid */
    .gov-seal-bg {
      background-image: radial-gradient(rgba(26, 58, 107, 0.02) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #F3F4F6;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    @keyframes pulse-red {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4);
      }

      50% {
        transform: scale(1.02);
        box-shadow: 0 0 0 10px rgba(220, 38, 38, 0);
      }
    }

    .animate-pulse-red {
      animation: pulse-red 2s infinite;
    }

    @keyframes siren {

      0%,
      100% {
        background-color: #FEE2E2;
      }

      50% {
        background-color: #FCA5A5;
      }
    }

    .animate-siren {

          await realDb.collection("users").doc(creds.user.uid).set({ name, phone: "", city: "", language: "en" });
          return creds.user;
        } else {
          await mockDelay();
          const users = getLocalColl("mock_users");
          if (users.find(u => u.email === email)) throw new Error("Email already registered!");
          const newUser = { uid: "local_" + Math.random().toString(36).substr(2, 9), email, displayName: name };
          users.push(newUser);
          setLocalColl("mock_users", users);
          return newUser;

          const profiles = getLocalColl("mock_profiles");
          const idx = profiles.findIndex(p => p.userId === uid);
          if (idx > -1) profiles[idx] = { ...profiles[idx], ...data };
          else profiles.push({ userId: uid, ...data });
          setLocalColl("mock_profiles", profiles);
        }
      },
      getUser: async (uid) => {
        if (isFirebaseActive) {
          const doc = await realDb.collection("users").doc(uid).get();

          return getLocalColl("mock_profiles").find(p => p.userId === uid) || null;

      // Synthesize Emergency Siren sweep
      const triggerAudioSiren = () => {
        if (isPlayingSiren) {
          if (oscRef.current) try { oscRef.current.stop(); } catch (e) { }
          if (lfoRef.current) try { lfoRef.current.stop(); } catch (e) { }
          if (audioCtxRef.current) try { audioCtxRef.current.close(); } catch (e) { }
          audioCtxRef.current = null;
          oscRef.current = null;
          setIsPlayingSiren(false);
        } else {
          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtxRef.current = audioCtx;

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);

            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            oscRef.current = osc;

            const lfo = audioCtx.createOscillator();
            lfo.frequency.setValueAtTime(2.0, audioCtx.currentTime);
            lfoRef.current = lfo;

            const lfoGain = audioCtx.createGain();
            lfoGain.gain.setValueAtTime(150, audioCtx.currentTime);

            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            lfo.start();
            osc.start();
            setIsPlayingSiren(true);
          } catch (e) {
            console.error("Audio Context blocked", e);
            setIsPlayingSiren(true);
          }

      const speakText = (txt) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(txt);
          if (language === 'hi') utterance.lang = 'hi-IN';
          else if (language === 'mr') utterance.lang = 'mr-IN';
          else utterance.lang = 'en-IN';
          window.speechSynthesis.speak(utterance);
        }
      };

      // OpenAI API Wrapper
      const fetchOpenAIResponse = async (historyArr, newText) => {
        if (!openAIApiKey) return null;

        const systemPrompt = `You are the Smart FIR Legal AI Companion for India. Guide the citizen empathetically to draft an FIR based on BNS 2023. Speak in their chosen language (${language === 'hi' ? 'Hindi' : language === 'mr' ? 'Marathi' : 'English'}). 
If you detect the incident category (Theft / Robbery, Cybercrime / Fraud, Assault / Violence, Harassment / Stalking), strictly append the exact tag [CAT: CategoryName] at the very end of your response. 
If you have gathered enough details (Date, Location, and Description of the incident), strictly append the exact tag [STATUS: READY] at the very end of your response so the system can generate the PDF.
Keep your responses short, calm, and highly professional. Do not ask more than one question at a time.`;

        const messages = [
          { role: "system", content: systemPrompt },
          ...historyArr.filter(m => m.role === 'user' || m.role === 'assistant').map(m => ({
            role: m.role,
            content: m.text.replace(/\[CAT:.*?\]/g, '').replace(/\[STATUS: READY\]/g, '').trim()
          })),
          { role: "user", content: newText }
        ];

        try {
          const res = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${openAIApiKey}`
            },
            body: JSON.stringify({
              model: "gpt-3.5-turbo",
              messages: messages,
              temperature: 0.7,
              max_tokens: 300
            })
          });

          if (!res.ok) throw new Error("API Error");
          const data = await res.json();
          return data.choices[0].message.content;
        } catch (e) {
          console.error("OpenAI Error:", e);
          return null; // triggers fallback
        }
      };

      // NLP Real-time Text Parser Helper
      const parseIncidentText = (text) => {
        const lowerText = text.toLowerCase();
        const extracted = {};

        // Timeline extraction
        const timePatterns = /(yesterday|last night|today|at \d{1,2}(?::\d{2})?\s*(am|pm)?|around \d{1,2}(?::\d{2})?\s*(am|pm)?|on \d{1,2}(st|nd|rd|th)? \w+)/i;
        const timeMatch = text.match(timePatterns);
        if (timeMatch) extracted.incidentDate = "Detected: " + timeMatch[0];

        // Location extraction
        const locPatterns = /(?:at|near|outside|in|opposite) ([a-zA-Z0-9\s]+(?:metro|gate|station|street|road|junction|nagar|complex|mall|shop))/i;
        const locMatch = text.match(locPatterns);
        if (locMatch) extracted.incidentLocation = "Detected: " + locMatch[1].trim();

        // Witness/Suspect basic extraction
        if (lowerText.includes("wearing") || lowerText.includes("tall") || lowerText.includes("short") || lowerText.includes("number plate")) {
          extracted.accusedDesc = "Detected suspect details from text";
        }

        return extracted;
      };

      // FIR Readiness Calculators
      const getCompleteness = () => {
        let score = 0;
        if (userProfile.name && userProfile.name !== "Anonymous Citizen") score += 20;
        if (answers.incidentDate && !answers.incidentDate.includes("T")) score += 20;
        else if (answers.incidentDate) score += 10;
        if (answers.incidentLocation && answers.incidentLocation !== "Sakinaka metro junction, Mumbai") score += 20;
        if (answers.incidentDesc && answers.incidentDesc.length >= 15) score += 30;
        if (answers.witnessName || answers.accusedDesc) score += 10;
        return score > 100 ? 100 : score;
      };

      const getMissingFields = () => {
        const missing = [];
        if (!userProfile.name || userProfile.name === "Anonymous Citizen") missing.push(language === 'en' ? "Complainant Name" : language === 'hi' ? "शिकायतकर्ता का नाम" : "तक्रारदाराचे नाव");
        if (!answers.incidentDate || answers.incidentDate.includes("T")) missing.push(language === 'en' ? "Exact Date/Time" : language === 'hi' ? "सटीक तिथि/समय" : "अचूक वेळ");
        if (!answers.incidentLocation || answers.incidentLocation === "Sakinaka metro junction, Mumbai") missing.push(language === 'en' ? "Place of Occurrence" : language === 'hi' ? "घटना का स्थान" : "घटनेचे ठिकाण");
        if (!answers.incidentDesc || answers.incidentDesc.length < 15) missing.push(language === 'en' ? "Detailed Statement" : language === 'hi' ? "विस्तृत विवरण" : "तपशीलवार माहिती");
        return missing;
      };

      // NLP classifier & State Machine response
      const handleBotResponse = async (userText) => {
        setIsTyping(true);

        const containsEmergency = EMERGENCY_TRIGGERS.some(trigger =>
          userText.toLowerCase().includes(trigger)
        );
        if (containsEmergency) {
          setTimeout(() => {
            setIsTyping(false);
            setCurrentScreen('sos');
            triggerAudioSiren();
          }, 800);
          return;
        }

        // security warning
        const credentialsPattern = /\b\d{4}[ -]?\d{4}[ -]?\d{4}\b/g;
        if (credentialsPattern.test(userText) || userText.toLowerCase().includes('otp') || userText.toLowerCase().includes('password')) {
          setTimeout(() => {
            setIsTyping(false);
            setShowWarning(true);
            setChatHistory(prev => [
              ...prev,
              { role: "assistant", text: language === 'hi' ? "🚨 सुरक्षा चेतावनी: आधार या पासवर्ड दर्ज न करें।" : language === 'mr' ? "🚨 सुरक्षा चेतावणी: आधार किंवा पासवर्ड देऊ नका." : "🚨 SECURITY WARNING: Never enter Aadhaar or passwords here." }
            ]);
          }, 1000);
          return;
        }

        // Real-time Parsing for Visual Dashboard (Always Runs)
        const extractedParams = parseIncidentText(userText);
        setAnswers(prev => {
          const updated = { ...prev };
          if (chatStage === 'intro' || chatStage === 'confirming') {
            updated.incidentDesc = (updated.incidentDesc + " " + userText).trim();
          }
          if (extractedParams.incidentDate && prev.incidentDate.includes("T")) updated.incidentDate = extractedParams.incidentDate;
          if (extractedParams.incidentLocation && prev.incidentLocation === "Sakinaka metro junction, Mumbai") updated.incidentLocation = extractedParams.incidentLocation;
          if (extractedParams.accusedDesc && !prev.accusedDesc) updated.accusedDesc = extractedParams.accusedDesc;
          return updated;
        });

        // HYBRID ENGINE: OpenAI vs Offline Regex Fallback
        if (openAIApiKey) {
          const botReplyRaw = await fetchOpenAIResponse(chatHistory, userText);

          if (botReplyRaw) {
            setIsTyping(false);
            let botReplyClean = botReplyRaw;
            let detectedCat = null;
            let isReady = false;

            // Parse Hidden System Tags
            const catMatch = botReplyRaw.match(/\[CAT:\s*(.*?)\]/);
            if (catMatch) {
              detectedCat = catMatch[1].trim();
              botReplyClean = botReplyClean.replace(catMatch[0], '').trim();
            }
            if (botReplyRaw.includes("[STATUS: READY]")) {
              isReady = true;
              botReplyClean = botReplyClean.replace(/\[STATUS: READY\]/g, '').trim();
            }

            if (detectedCat) {
              // Map the GPT category guess to our internal system categories
              let safeCat = "Other";
              if (detectedCat.toLowerCase().includes("theft") || detectedCat.toLowerCase().includes("rob")) safeCat = "Theft / Robbery";
              else if (detectedCat.toLowerCase().includes("cyber") || detectedCat.toLowerCase().includes("fraud")) safeCat = "Cybercrime / Fraud";
              else if (detectedCat.toLowerCase().includes("assault") || detectedCat.toLowerCase().includes("violen")) safeCat = "Assault / Violence";
              else if (detectedCat.toLowerCase().includes("harass") || detectedCat.toLowerCase().includes("stalk")) safeCat = "Harassment / Stalking";
              else if (detectedCat.toLowerCase().includes("accident")) safeCat = "Accident / Road Incident";

              setChatCategory(safeCat);
              setClassifiedCategory(safeCat);
              const legalDetails = getLegalSections(safeCat);
              setSeverity(legalDetails.severity);
              setChatStage('confirming');

              setChatHistory(prev => [
                ...prev,
                { role: "assistant", text: botReplyClean, isClassificationPrompt: true, categorySuggested: safeCat }
              ]);
            } else if (isReady) {
              setChatStage('completed');
              setChatHistory(prev => [
                ...prev,
                { role: "assistant", text: botReplyClean, isCompletedPrompt: true }
              ]);
            } else {
              setChatHistory(prev => [
                ...prev,
                { role: "assistant", text: botReplyClean }
              ]);
            }
            return; // Exit after handling OpenAI
          }
        }

        // OFFLINE FALLBACK ENGINE (If no API Key or Fetch failed)
        setTimeout(() => {
          setIsTyping(false);

          // State Machine Logic
          if (chatStage === 'intro') {
            let cat = "Other";
            if (userText.toLowerCase().includes("stolen") || userText.toLowerCase().includes("theft") || userText.toLowerCase().includes("robbed") || userText.toLowerCase().includes("wallet")) {
              cat = "Theft / Robbery";
            } else if (userText.toLowerCase().includes("cyber") || userText.toLowerCase().includes("fraud") || userText.toLowerCase().includes("scam") || userText.toLowerCase().includes("hacked")) {
              cat = "Cybercrime / Fraud";
            } else if (userText.toLowerCase().includes("assault") || userText.toLowerCase().includes("fight") || userText.toLowerCase().includes("violence") || userText.toLowerCase().includes("beat")) {
              cat = "Assault / Violence";
            } else if (userText.toLowerCase().includes("stalk") || userText.toLowerCase().includes("harass") || userText.toLowerCase().includes("followed")) {
              cat = "Harassment / Stalking";
            }

            setChatCategory(cat);
            setClassifiedCategory(cat);
            const legalDetails = getLegalSections(cat);
            setSeverity(legalDetails.severity);

            setChatStage('confirming');

            let reply = `Based on your description, this incident is categorized under "${cat}".\n\nPrima Facie Sections: ${legalDetails.bns}\nAssessed Severity level: ${legalDetails.severity}.\n\nShould we proceed to gather specific details directly in this chat?`;
            if (language === 'hi') reply = `आपके विवरण के आधार पर यह मामला "${cat}" श्रेणी में आता है।\nलागू धाराएं: ${legalDetails.bns}\nक्या हम विवरण दर्ज करने के लिए आगे बढ़ें?`;
            if (language === 'mr') reply = `तुमच्या माहितीनुसार हे "${cat}" श्रेणीत येते.\nलागू कलमे: ${legalDetails.bns}\nआपण पुढील माहिती घेण्यास सुरुवात करूया का?`;

            setChatHistory(prev => [
              ...prev,
              { role: "assistant", text: reply, isClassificationPrompt: true, categorySuggested: cat }
            ]);
          } else if (chatStage === 'questioning') {
            // Answer the current question
            const currentQ = chatQuestionsList[chatQuestionIdx];
            setAnswers(prev => ({ ...prev, [currentQ.key]: userText }));

            if (chatQuestionIdx < chatQuestionsList.length - 1) {
              const nextIdx = chatQuestionIdx + 1;
              setChatQuestionIdx(nextIdx);
              const nextQ = chatQuestionsList[nextIdx];
              setChatHistory(prev => [
                ...prev,
                { role: "assistant", text: language === 'en' ? nextQ.q : language === 'hi' ? "कृपया बताएं: " + nextQ.q : "कृपया सांगा: " + nextQ.q }
              ]);
            } else {
              setChatStage('completed');
              let reply = `Thank you. I have recorded all necessary details for your "${chatCategory}" complaint. Your FIR draft is now ready!`;
              if (language === 'hi') reply = `धन्यवाद। मैंने आपकी "${chatCategory}" शिकायत के सभी आवश्यक विवरण दर्ज कर लिए हैं। आपका FIR मसौदा अब तैयार है!`;
              if (language === 'mr') reply = `धन्यवाद. मी तुमच्या "${chatCategory}" तक्रारीची सर्व आवश्यक माहिती नोंदवली आहे. तुमचा FIR मसुदा तयार आहे!`;

              setChatHistory(prev => [
                ...prev,
                { role: "assistant", text: reply, isCompletedPrompt: true }
              ]);
            }
          } else if (chatStage === 'completed') {
            setChatHistory(prev => [
              ...prev,
              { role: "assistant", text: language === 'en' ? "Your draft is ready. Please click 'Generate Formal FIR Draft' on the sidebar to proceed." : language === 'hi' ? "आपका मसौदा तैयार है। कृपया आगे बढ़ने के लिए 'औपचारिक FIR ड्राफ्ट तैयार करें' पर क्लिक करें।" : "मसुदा तयार आहे. 'मसुदा तयार करा' वर क्लिक करा." }
            ]);
          }

        }, 1200);
      };

      const submitChat = () => {
        if (!userInput.trim()) return;
        setChatHistory(prev => [...prev, { role: "user", text: userInput }]);
        const text = userInput;
        setUserInput('');
        handleBotResponse(text);
      };

      const confirmClassification = (cat) => {
        setChatCategory(cat);
        setClassifiedCategory(cat);
        const qList = CATEGORY_QUESTIONS[cat] || CATEGORY_QUESTIONS["Other"];
        setChatQuestionsList(qList);
        setChatQuestionIdx(0);
        setChatStage('questioning');

        setChatHistory(prev => [
          ...prev,
          { role: "assistant", text: language === 'en' ? `Great, let's start. ${qList[0].q}` : language === 'hi' ? `चलिए शुरू करते हैं। ${qList[0].q}` : `चला सुरू करूया. ${qList[0].q}` }
        ]);
      };

      // Authentication Submission Handler
      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        try {
          if (authTab === 'login') {
            const u = await authService.login(email, password);
            setCurrentUser(u);
            const p = await dbService.getUser(u.uid);
            if (p) setUserProfile(p);
            else setUserProfile({ name: u.displayName || email.split("@")[0], phone: "", city: "", language });
            setCurrentScreen('dashboard');
          } else if (authTab === 'register') {
            const u = await authService.signUp(email, password, registerName);
            setCurrentUser(u);
            const initialP = { name: registerName, phone: "", city: "", language };
            await dbService.saveUser(u.uid, initialP);
            setUserProfile(initialP);
            setCurrentScreen('dashboard');
          }
        } catch (err) {
          setAuthError(err.message);
        }
      };

      const handleOTPTrigger = (e) => {
        e.preventDefault();
        if (!phone || phone.length < 10) {
          setAuthError("Enter a valid 10-digit number.");
          return;
        }
        setOtpSent(true);
        setAuthError('');
        alert("Simulation OTP code 123456 sent via SMS to +91-" + phone);
      };

      const handleOTPVerify = async (e) => {
        e.preventDefault();
        if (otpCode === '123456') {
          const guest = await authService.loginAsGuest();
          setCurrentUser(guest);
          setUserProfile({ name: "Citizen " + phone.slice(-4), phone, city: "Mumbai, MH", language });
          setCurrentScreen('dashboard');
        } else {
          setAuthError("Incorrect code. Use 123456 to simulate.");
        }
      };

      const handleGuestLogin = async () => {
        const guest = await authService.loginAsGuest();
        setCurrentUser(guest);
        setUserProfile({ name: "Guest Citizen", phone: "", city: "Mumbai", language });
        setCurrentScreen('dashboard');
      };

      // Secure Evidence File Upload
      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        alert("Encrypting and indexing file locally.");
        setEvidenceFiles(prev => [
          ...prev,
          { id: Date.now(), name: file.name, size: (file.size / 1024).toFixed(1) + " KB", category: classifiedCategory + " Proof", time: "Just now" }
        ]);
      };

      // PDF Generation Exporter
      const exportPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const legal = getLegalSections(classifiedCategory);
        const trans = TRANSLATED_COMPLAINT[draftLangTab] || TRANSLATED_COMPLAINT['en'];

        // Border Frame decoration
        doc.rect(5, 5, 200, 287);
        doc.rect(6.5, 6.5, 197, 284);

        doc.setFillColor(26, 58, 107);
        doc.rect(7, 7, 196, 2);

        doc.setFont("Helvetica", "bold");
        doc.setFontSize(13);
        doc.setTextColor(26, 58, 107);
        doc.text(trans.headerTitle, 105, 18, { align: "center" });

        doc.setFontSize(8.5);
        doc.setFont("Helvetica", "normal");
        doc.setTextColor(80, 80, 80);
        doc.text(trans.headerSub, 105, 23, { align: "center" });

        doc.line(15, 27, 195, 27);

        doc.setFontSize(9.5);
        doc.setTextColor(0, 0, 0);
        doc.setFont("Helvetica", "bold");
        doc.text(trans.section1, 15, 34);
        doc.setFont("Helvetica", "normal");
        doc.text(trans.state, 20, 40);
        doc.text(trans.district, 110, 40);
        doc.text(trans.station, 20, 46);

        doc.line(15, 51, 195, 51);

        doc.setFont("Helvetica", "bold");
        doc.text(trans.section2, 15, 58);
        doc.setFont("Helvetica", "normal");
        doc.text(`${trans.name} ${answers.complainantName || userProfile.name}`, 20, 64);
        doc.text(`${trans.phone} ${answers.complainantPhone || userProfile.phone || 'N/A'}`, 110, 64);
        doc.text(`${trans.city} ${answers.complainantAddress || userProfile.city}`, 20, 70);

        doc.line(15, 76, 195, 76);

        doc.setFont("Helvetica", "bold");
        doc.text(trans.section3, 15, 83);
        doc.setFont("Helvetica", "normal");
        doc.text(`${trans.incidentDate} ${answers.incidentDate.replace('T', ' ')}`, 20, 89);
        doc.text(`${trans.incidentLoc} ${answers.incidentLocation}`, 20, 95);

        doc.line(15, 101, 195, 101);

        doc.setFont("Helvetica", "bold");
        doc.text(trans.section4, 15, 108);
        doc.setFont("Helvetica", "normal");
        const splitDesc = doc.splitTextToSize(answers.incidentDesc || "Incident of " + classifiedCategory, 175);
        doc.text(splitDesc, 20, 114);

        let currentY = 114 + (splitDesc.length * 5) + 5;
        doc.line(15, currentY, 195, currentY);

        currentY += 7;
        doc.setFont("Helvetica", "bold");
        doc.text(trans.section6, 15, currentY);
        doc.setFont("Helvetica", "normal");
        currentY += 6;
        doc.text(`${trans.severity} ${severity}`, 20, currentY);
        currentY += 5;
        doc.text(`${trans.bnsCode} ${legal.bns}`, 20, currentY);
        currentY += 5;
        doc.text(`${trans.ipcCode} ${legal.ipc}`, 20, currentY);
        currentY += 5;

        const splitNote = doc.splitTextToSize(legal.desc, 175);
        doc.text(splitNote, 20, currentY);
        currentY += (splitNote.length * 5) + 5;

        doc.line(15, currentY, 195, currentY);

        currentY += 7;
        doc.setFont("Helvetica", "bold");
        doc.text(trans.section7, 15, currentY);
        doc.setFont("Helvetica", "normal");
        currentY += 6;
        evidenceFiles.forEach((file, index) => {
          doc.text(`- File ${index + 1}: ${file.name} (${file.size})`, 20, currentY);
          currentY += 5;
        });

        currentY += 10;
        doc.setFont("Helvetica", "italic");
        doc.setFontSize(7.5);
        const splitDec = doc.splitTextToSize(trans.declaration, 175);
        doc.text(splitDec, 20, currentY);

        currentY += 18;
        doc.setFont("Helvetica", "bold");
        doc.setFontSize(9.5);
        doc.text(trans.signatureComplainant, 20, currentY);
        doc.text(trans.signatureOfficer, 130, currentY);

        doc.save(`Smart_FIR_Complaint_${draftLangTab.toUpperCase()}.pdf`);

        // Save report to localStorage list
        if (currentUser) {
          const reportId = "rep_" + Date.now();
          dbService.saveFIRReport(reportId, {
            userId: currentUser.uid,
            incidentType: classifiedCategory,
            incidentDate: answers.incidentDate,
            location: answers.incidentLocation,
            firDraft: answers
          });
        }

        setCurrentScreen('pdfsuccess');
      };

      const saveDeveloperConfig = () => {
        if (apiConfigInput) {
          localStorage.setItem("firebaseConfig", apiConfigInput);
          alert("Firebase credentials updated. App will now reload in LIVE mode!");
          window.location.reload();
        } else {
          localStorage.removeItem("firebaseConfig");
          alert("Developer config cleared. Reloading.");
          window.location.reload();
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">

          {/* ----------------------------------------------------
                OFFICIAL HEADER BAR
                ---------------------------------------------------- */}
          <header className="sticky top-0 z-50 bg-[#1A3A6B] text-white border-b-4 border-[#D97706] shadow-md px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">

              <div className="flex items-center gap-3 cursor-pointer" onClick={() => {
                if (currentUser) setCurrentScreen('dashboard');
                else setCurrentScreen('splash');
              }}>
                <div className="flex items-center justify-center w-10 h-10 rounded bg-white text-[#1A3A6B] shadow">
                  <Icon name="shield" className="w-6 h-6 text-[#1A3A6B]" />
                </div>
                <div>
                  <h1 className="text-lg font-black tracking-tight leading-none font-montserrat">{text.appName}</h1>
                  <span className="text-[9px] text-amber-400 font-bold uppercase tracking-wider block mt-0.5">National Security Assistant</span>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3">

                {/* Security Clearance Tag */}
                <div className="hidden lg:flex items-center gap-2 px-3 py-1 rounded bg-[#12284C] text-[10px] text-emerald-400 font-mono border border-emerald-500/20">
                  <div className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></div>
                  {text.securityStatus}
                </div>

                {/* Bilingual language switcher */}
                <div className="flex bg-[#12284C] p-1 rounded border border-white/10">
                  {['en', 'hi', 'mr'].map(lang => (
                    <button
                      key={lang}
                      onClick={() => setLanguage(lang)}
                      className={`px-2 py-0.5 text-xs font-bold rounded uppercase transition-all duration-200 ${language === lang ? 'bg-[#D97706] text-white' : 'text-slate-300 hover:text-white'
                        }`}
                    >
                      {lang === 'en' ? 'ENG' : lang === 'hi' ? 'हिंदी' : 'मराठी'}
                    </button>
                  ))}
                </div>

                {/* Dev Settings trigger */}
                <button
                  onClick={() => setShowDevConsole(!showDevConsole)}
                  className="p-1.5 rounded bg-[#12284C] border border-white/10 text-slate-300 hover:text-amber-400"
                  title="Developer Connections"
                >
                  <Icon name="settings" className="w-4 h-4" />
                </button>

                {currentUser && (
                  <>
                    {currentScreen !== 'dashboard' && (
                      <button
                        onClick={() => {
                          if (currentScreen === 'sos' && isPlayingSiren) triggerAudioSiren();
                          setCurrentScreen('dashboard');
                        }}
                        className="px-3 py-1 bg-white/10 hover:bg-white/20 text-white rounded text-xs font-bold flex items-center gap-1"
                      >
                        <Icon name="arrowLeft" className="w-3.5 h-3.5" /> Portal Home
                      </button>
                    )}
                    <button
                      onClick={() => {
                        if (isPlayingSiren) triggerAudioSiren();
                        setCurrentUser(null);
                        setCurrentScreen('auth');
                      }}
                      className="px-3 py-1 bg-red-800/80 hover:bg-red-800 text-white rounded text-xs font-bold flex items-center gap-1"

                              : language === 'hi'

                                : 'आपली तयारी पूर्ण झाली आहे! मसुदा घेऊन जवळच्या पोलीस ठाण्याला भेट द्या:'}
                          </p>

                          <div className="grid grid-cols-1 md:grid-cols-12 gap-5 mb-6">
                            <div className="md:col-span-7 h-52 bg-slate-100 rounded-2xl overflow-hidden border border-slate-200 relative">
                              <iframe
                                title="Precinct Wizard Maps"
                                width="100%"
                                height="100%"
                                frameBorder="0"
                                style={{ border: 0 }}
                                src={`https://www.google.com/maps/embed/v1/place?key=${googleMapsKey || 'AIzaSyDummyKeyForStaticFallback'}&q=Sakinaka+Police+Station,Mumbai+Maharashtra&zoom=14`}
                                allowFullScreen
                                className="absolute inset-0"
                              />
                            </div>

                            <div className="md:col-span-5 flex flex-col gap-2.5">
                              {POLICE_STATIONS.map((ps) => (
                                <div key={ps.id} className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-[10px] flex justify-between items-center font-medium">
                                  <div>
                                    <p className="font-bold text-slate-800">{ps.name}</p>
                                    <p className="text-slate-400 font-mono mt-0.5">{ps.distance} &bull; {ps.contact}</p>
                                  </div>
                                  <button
                                    onClick={() => alert(`Calling hotline: ${ps.contact}`)}
                                    className="p-1.5 bg-[#E8EEF5] text-[#1A3A6B] rounded border border-[#1A3A6B]/10 hover:bg-[#1A3A6B] hover:text-white transition-all"
                                  >
                                    <Icon name="phone" className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              ))}
                            </div>
                          </div>

                          {/* Final disclaimer banner */}
                          <div className="p-4 bg-amber-50 border border-amber-250 rounded-2xl text-xs text-amber-800 leading-normal flex gap-3 shadow-sm mb-6">
                            <Icon name="info" className="w-5 h-5 text-amber-700 shrink-0 mt-0.5" />
                            <p>{text.firDisclaimer}</p>
                          </div>
                        </div>
                      )}

                      {/* Navigation bottom buttons */}
                      <div className="flex justify-between items-center pt-6 mt-6 border-t border-slate-100">
                        <button
                          onClick={() => {
                            if (wizardStep > 1) {
                              setWizardStep(prev => prev - 1);
                            } else {
                              setWizardCategory(null);
                            }
                          }}
                          className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 text-xs font-bold rounded-xl flex items-center gap-1 transition-all"
                        >
                          <Icon name="arrowLeft" className="w-3.5 h-3.5" />
                          {language === 'en' ? 'Previous Step' : 'पिछला चरण'}
                        </button>

                        <div className="flex gap-2">
                          <button
                            onClick={() => {
                              if (isPlayingSiren) triggerAudioSiren();
                              setCurrentScreen('dashboard');
                            }}
                            className="px-4 py-2.5 text-slate-500 hover:text-slate-700 text-xs font-bold transition-all"
                          >
                            {language === 'en' ? 'Exit Wizard' : 'बाहर निकलें'}
                          </button>

                          {wizardStep < 7 ? (
                            <button
                              onClick={() => {
                                // Simple validation for step 3 description
                                if (wizardStep === 3 && !wizardForm.incidentDesc.trim()) {
                                  alert(language === 'en' ? 'Please provide a simple incident description first.' : 'कृपया घटना का संक्षिप्त विवरण अवश्य दर्ज करें।');
                                  return;
                                }
                                setWizardStep(prev => prev + 1);
                              }}
                              className="px-6 py-2.5 bg-[#1A3A6B] hover:bg-[#12284C] text-white text-xs font-bold rounded-xl flex items-center gap-1 shadow transition-all"
                            >
                              {language === 'en' ? 'Next Step' : 'अगला चरण'}
                              <Icon name="chevronRight" className="w-3.5 h-3.5 text-white" />
                            </button>
                          ) : (
                            <button
                              onClick={() => {
                                setCurrentScreen('dashboard');
                              }}
                              className="px-6 py-2.5 bg-[#1A3A6B] hover:bg-[#12284C] text-white text-xs font-bold rounded-xl flex items-center gap-1 shadow transition-all"
                            >
                              {language === 'en' ? 'Finish Guided Setup' : 'मार्गदर्शन समाप्त करें'}
                              <Icon name="check" className="w-3.5 h-3.5 text-white" />
                            </button>
                          )}
                        </div>
                      </div>

                    </div>
                  </div>
                )}

              </div>
            )}

          </main>

          {/* ----------------------------------------------------
                OFFICIAL PORTAL FOOTER
                ---------------------------------------------------- */}
          <footer className="mt-20 text-center text-xs text-slate-400 font-mono max-w-xl mx-auto leading-relaxed border-t border-slate-200 pt-6 pb-12">
            <p>&copy; 2026 Smart FIR Portal &bull; Safe Citizen Legal Initiative.</p>
            <p className="mt-1 text-[9px] text-slate-400">All complaint drafts comply strictly with the Bharatiya Nyaya Sanhita (BNS), 2023 & IPC, 1860.</p>
          </footer>

        </div>
      );
    }

    // Render root node
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
